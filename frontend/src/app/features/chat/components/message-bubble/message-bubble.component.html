<div class="bubble-row" [class.user]="message.role === 'user'" [class.assistant]="message.role === 'assistant'">
  @if (message.role === 'assistant') {
    <app-actor-portrait
      class="bubble-avatar"
      [src]="characterImageUrl"
      [name]="characterName"
      [alt]="characterName"
      size="sm"
    />
  }
  <div class="bubble">
    <div class="sender">{{ message.role === 'user' ? playerName : characterName }}</div>
    <div class="content" [class.typing]="isTyping">
      {{ displayedContent }}@if (isTyping) {<span class="typing-cursor" aria-hidden="true"></span>}
    </div>
    @if (message.role === 'assistant' && showRegenerate) {
      <button
        type="button"
        class="regenerate-btn"
        [disabled]="regenerating"
        (click)="regenerate.emit()"
      >
        {{ regenerating ? 'Regenerating…' : 'Regenerate reply' }}
      </button>
    }
  </div>
  @if (message.role === 'user') {
    <app-actor-portrait
      class="bubble-avatar"
      [src]="playerImageUrl"
      [name]="playerName"
      [alt]="playerName"
      size="sm"
    />
  }
</div>
