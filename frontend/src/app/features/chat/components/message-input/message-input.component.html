<div class="input-area">
  <textarea
    [(ngModel)]="content"
    [disabled]="disabled"
    (keydown)="onKeydown($event)"
    placeholder="Type your action or dialogue..."
    rows="3"
  ></textarea>
  <button type="button" (click)="onSend()" [disabled]="disabled || !content.trim()">
    Send
  </button>
</div>
