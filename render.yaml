services:
  - type: web
    name: interactive-ai-roleplay-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ROLEPLAY_DATA_DIR
        value: /data
