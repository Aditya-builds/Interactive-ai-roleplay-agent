quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
# JDK 24+ warns on sun.misc.Unsafe in transitive libs (e.g. jboss-threads) until they migrate to VarHandle.
quarkus.jvm.args=--sun-misc-unsafe-memory-access=allow
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-llm-api-key

roleplay.data.dir=${ROLEPLAY_DATA_DIR:../data}

# LLM (OpenAI-compatible: OpenAI, DeepSeek, etc.)
roleplay.llm.api-key=${LLM_API_KEY:${OPENAI_API_KEY:}}
roleplay.llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
roleplay.llm.model=${LLM_MODEL:gpt-4o}
roleplay.llm.temperature=0.8
roleplay.llm.max-tokens=2500
roleplay.llm.json-mode=true
roleplay.llm.max-retries=3
roleplay.llm.retry-base-delay-ms=1000
roleplay.llm.two-phase=false
roleplay.llm.extraction-max-tokens=800

# Legacy keys (backward compatible)
roleplay.llm.openai.api-key=${OPENAI_API_KEY:}
roleplay.llm.openai.model=gpt-4
roleplay.llm.openai.base-url=https://api.openai.com/v1

roleplay.prompt.max-history-messages=20
roleplay.prompt.recent-events-count=5
roleplay.prompt.important-memories-count=8
roleplay.memory.importance-threshold=0.5
roleplay.memory.max-count=30
roleplay.events.max-count=50
roleplay.state.max-relationship-delta=3
roleplay.state.max-relationship-total-delta=6
roleplay.state.max-health-delta=50
roleplay.state.max-changes-per-turn=5

# Visual generation (provider-agnostic layer)
roleplay.visual.enabled=true
roleplay.visual.provider=${VISUAL_PROVIDER:openai}
roleplay.visual.base-url=${VISUAL_BASE_URL:https://api.openai.com/v1}
roleplay.visual.model=${VISUAL_MODEL:gpt-image-2}
roleplay.visual.default-aspect-ratio=16:9
roleplay.visual.default-width=1024
roleplay.visual.default-height=576

# DeepSeek (OpenAI-compatible): set in backend/.env
# LLM_API_KEY=your-deepseek-key
# LLM_BASE_URL=https://api.deepseek.com/v1
# LLM_MODEL=deepseek-chat

# API key is loaded from backend/.env (OPENAI_API_KEY or LLM_API_KEY) in dev mode
